# Generated by OpsCrew from opscrew/plan.yaml; `opscrew provision` regenerates it.
# Builds the site and publishes it on GitHub Pages. Secrets are set by `opscrew provision`; their
# values never appear in this file, but whatever the build puts into the site is public.
name: OpsCrew deploy

on:
  push:
    branches: ["main"]
    # A push starts it only when it changes one of these paths, which the run reads.
    paths:
      - "**"
      - "!opscrew/**"
      - "!.github/workflows/opscrew-deploy*.yml"
      - ".github/workflows/opscrew-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: opscrew-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Hugo 0.168.0
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/hugo.tar.gz" https://github.com/gohugoio/hugo/releases/download/v0.168.0/hugo_extended_0.168.0_linux-amd64.tar.gz
          echo "787f100057328824f38c6ad7c87ff10d6451ae0a7bc39cedaad0dd2bcde17e53  $RUNNER_TEMP/hugo.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo"
          sudo install -m 0755 "$RUNNER_TEMP/hugo/hugo" /usr/local/bin/hugo
          hugo version
      - name: Build the site
        working-directory: "."
        run: |
          set -euo pipefail
          hugo --minify
      - name: Check the site against GitHub Pages' limit
        run: |
          set -euo pipefail
          if [[ ! -d 'public' ]]; then
            echo "::error::The build left no folder public, where opscrew/plan.yaml expects the site's files (target.site.outputDir): change target.site in opscrew/plan.yaml to what the build writes, then run \`opscrew provision\` again."
            exit 1
          fi
          bytes="$(du -sb 'public' | cut -f 1)"
          if [[ "$bytes" -gt 1073741824 ]]; then
            echo "::error::The site in public is $(( bytes / 1048576 )) MB, over the 1 GB GitHub Pages publishes. Leave out the files the site does not need, or host it on Cloudflare (\`opscrew design\`), then push again."
            exit 1
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Keep the built site for GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "public"
          # Keeps files such as .well-known, which the action leaves out otherwise.
          include-hidden-files: true

  deploy:
    name: Publish on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish the site
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Check that the site answers
        env:
          URL: https://e2e-mvmg8e522e373adc.opscrew.dev/
        run: |
          set -uo pipefail
          tls_only=1
          for attempt in $(seq 1 30); do
            code=0
            curl -fsS --max-time 10 -o /dev/null "$URL" || code=$?
            if [[ "$code" -eq 0 ]]; then
              echo "The site answers after $attempt attempt(s)."
              exit 0
            fi
            case "$code" in 35 | 51 | 60) ;; *) tls_only=0 ;; esac
            sleep 6
          done
          if [[ "$tls_only" -eq 1 ]]; then
            echo "::warning::GitHub has not issued the certificate for e2e-mvmg8e522e373adc.opscrew.dev yet, so this run could not check the site over HTTPS. GitHub issues it once it has checked the domain's DNS records, which can take up to 24 hours; \`opscrew verify\` says when it is there. Then run \`opscrew provision\` to enforce HTTPS."
            exit 0
          fi
          echo "::error::The site did not answer at $URL."
          exit 1
