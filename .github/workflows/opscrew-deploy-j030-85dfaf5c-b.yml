# Generated by OpsCrew from opscrew/apps/j030-85dfaf5c-b/plan.yaml; `opscrew provision` regenerates it.
# Builds the app image, pushes it to GitHub Container Registry and deploys it to your server
# over SSH. Secrets are set by `opscrew provision`; their values never appear in this file.
name: OpsCrew deploy j030-85dfaf5c-b

on:
  push:
    branches: ["main"]
    # A push starts it only when it changes one of these paths, which the run reads.
    paths:
      - "**"
      - "!opscrew/**"
      - "!.github/workflows/opscrew-deploy*.yml"
      - "!.github/workflows/opscrew-preview*.yml"
      - "!koa-knex/**"
      - "express-api/Dockerfile"
      - "opscrew/apps/j030-85dfaf5c-b/runtime/compose.yaml"
      - "opscrew/apps/j030-85dfaf5c-b/runtime/edge/**"
      - ".github/workflows/opscrew-deploy-j030-85dfaf5c-b.yml"
  workflow_dispatch:
    inputs:
      digest:
        description: For a rollback, the image to deploy, by its digest (sha256:…); `opscrew rollback` fills it in.
        required: false
        type: string
        default: ""
      tag:
        description: For a rollback, the image's commit tag (<commit>, or <commit>-<env> outside prod); `opscrew rollback` fills it in.
        required: false
        type: string
        default: ""
      rollback:
        description: Deploy the image without running the release command, for a rollback; `opscrew rollback` sets it.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: opscrew-deploy-j030-85dfaf5c-b
  cancel-in-progress: false

jobs:
  paused:
    name: Report the deploy pause
    if: ${{ !(inputs.rollback) && contains(vars.OPSCREW_DEPLOY_PAUSED, '"j030-85dfaf5c-b/prod"') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Say why this run does not deploy
        env:
          KEY: "j030-85dfaf5c-b/prod"
          PAUSED: ${{ vars.OPSCREW_DEPLOY_PAUSED }}
        run: |
          set -euo pipefail
          field() { jq -r --arg key "$KEY" --arg field "$1" '.[$key][$field] // empty' <<< "$PAUSED"; }
          since="$(field since)"
          if [[ "$(field reason)" == rollback ]]; then
            commit="$(field commit)"
            image="$(field image)"
            if [[ "$image" == sha256:* ]]; then image="${image:0:19}"; fi
            text="Deploys of $KEY are paused since $since: \`opscrew rollback\` pinned it to ${commit:0:7} (${image}). This run built ${GITHUB_SHA:0:7} but didn't deploy it. \`opscrew rollback --app j030-85dfaf5c-b --resume --deploy\` deploys the branch's latest commit."
          elif [[ "$(field reason)" == rotation ]]; then
            text="Deploys of $KEY are paused since $since for a credential rotation's window: \`opscrew rotate --app j030-85dfaf5c-b\` with its services, or with \`--undo\`, ends it."
          else
            text="Deploys of $KEY are paused since $since while a service moves between the app's servers; \`opscrew provision --app j030-85dfaf5c-b\` resumes them."
          fi
          echo "::notice::$text"
          echo "$text" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build the image
    if: ${{ !inputs.rollback }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.final.outputs.ref }}
      tag: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: image
        name: Choose the image name
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repo}/j030-85dfaf5c-b" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${repo}/j030-85dfaf5c-b:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      # Keeps the GitHub event (commit messages, emails) out of the provenance; it still names the
      # workflow run, and the repository and commit of the checkout.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: provenance-add-gha=false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: "."
          file: "express-api/Dockerfile"
          # The provenance records build arguments: only non-secret values go there.
          build-args: ${{ secrets.OPSCREW_J030_85DFAF5C_B_BUILD_ENV }}
          secrets: ${{ secrets.OPSCREW_J030_85DFAF5C_B_BUILD_SECRETS }}
          push: true
          tags: ${{ steps.image.outputs.image }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: final
        name: Record the image digest
        env:
          NAME: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          ref="$NAME@$DIGEST"
          if [[ ! "$ref" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not read the digest of the pushed image; re-run the workflow."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$NAME:$GITHUB_SHA\` as \`$ref\`." >> "$GITHUB_STEP_SUMMARY"
      # The scan runs after the registry logout, so it never holds the job's packages: write token.
      - name: Scan the image (report only)
        env:
          IMAGE: ${{ steps.final.outputs.ref }}
        run: |
          set -euo pipefail
          docker pull --quiet "$IMAGE"
          docker logout ghcr.io
          if ! docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --no-progress --severity HIGH,CRITICAL --exit-code 0 "$IMAGE"; then
            echo "::warning::The image scan (Trivy) could not run, so this build has no scan report. The deploy goes on: the scan only reports."
          fi

  verify:
    name: Check where the image was built
    if: ${{ inputs.rollback }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      packages: read
    outputs:
      image: ${{ steps.provenance.outputs.image }}
      tag: ${{ steps.provenance.outputs.tag }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: provenance
        name: Check the image's provenance
        env:
          DIGEST: ${{ inputs.digest }}
          TAG: ${{ inputs.tag }}
          BUILD_BRANCH: "main"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The digest input is not an image digest (sha256: and 64 hexadecimal digits). Start this workflow with \`opscrew promote\` or \`opscrew rollback\`, which fill it in."
            exit 1
          fi
          name="ghcr.io/${GITHUB_REPOSITORY,,}/j030-85dfaf5c-b"
          image="$name@$DIGEST"
          if ! provenance="$(docker buildx imagetools inspect "$image" --format '{{json .Provenance}}')"; then
            echo "::error::GitHub Container Registry has no image $image. Start this workflow with \`opscrew promote\` or \`opscrew rollback\`, which choose an image that is there."
            exit 1
          fi
          # buildx names the run that built the image in runDetails.builder.id (per platform).
          mapfile -t runs < <(jq -r '.. | .runDetails?.builder?.id? // empty' <<< "$provenance" | sort -u)
          if [[ "${#runs[@]}" -ne 1 || ! "${runs[0]}" =~ ^https://github\.com/([^/]+/[^/]+)/actions/runs/([0-9]+)/attempts/[0-9]+$ ]]; then
            echo "::error::The image's build provenance does not name one GitHub Actions run, so OpsCrew cannot tell where it was built. OpsCrew deploys a digest only when this repository's deploy workflow built it."
            exit 1
          fi
          built_in="${BASH_REMATCH[1]}"
          run_id="${BASH_REMATCH[2]}"
          if [[ "${built_in,,}" != "${GITHUB_REPOSITORY,,}" ]]; then
            echo "::error::The image was built by a run of $built_in, not of this repository ($GITHUB_REPOSITORY). OpsCrew deploys a digest only when this repository built it."
            exit 1
          fi
          if ! record="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '"\(.event) \(.head_repository.full_name) \(.head_branch) \(.head_sha) \(.path)"')"; then
            echo "::error::GitHub shows no run $run_id in this repository, which the image's provenance names as its build. OpsCrew deploys a digest only when this repository built it."
            exit 1
          fi
          read -r event head_repo branch commit workflow <<< "$record"
          # The run's path can end with @<ref>, which the signing identity carries separately.
          workflow="${workflow%%@*}"
          # A fork's pull request runs in this repository too, with its own branch name: only a push, or a
          # run started by hand, which takes write access (ADR 0023 D1), counts.
          if [[ "$event" != "push" && "$event" != "workflow_dispatch" ]]; then
            echo "::error::The image was built by a $event run, not by a push or a run started by hand. OpsCrew deploys a digest only when a push to $BUILD_BRANCH, or a run started by hand there, built it."
            exit 1
          fi
          if [[ "${head_repo,,}" != "${GITHUB_REPOSITORY,,}" ]]; then
            echo "::error::The image was built from the commits of $head_repo, not of this repository ($GITHUB_REPOSITORY). OpsCrew deploys a digest only when this repository built it."
            exit 1
          fi
          if [[ "$branch" != "$BUILD_BRANCH" ]]; then
            echo "::error::The image was built from the branch $branch, not from $BUILD_BRANCH, the branch that builds this environment's images. OpsCrew deploys a digest only when a build on $BUILD_BRANCH made it."
            exit 1
          fi
          # prod's build tags its commit, another environment's <commit>-<env>.
          if [[ "$TAG" != "$commit" && ! "$TAG" =~ ^$commit-[a-z][a-z0-9-]*$ ]]; then
            echo "::error::The tag input is not a commit tag of the image's build ($commit, or $commit-<environment>). Start this workflow with \`opscrew promote\` or \`opscrew rollback\`, which fill it in."
            exit 1
          fi
          if [[ "$(docker buildx imagetools inspect "$name:$TAG" --format '{{.Manifest.Digest}}')" != "$DIGEST" ]]; then
            echo "::error::The image is not the one tagged with its build's commit ($TAG): a later build of that commit replaced the tag, or the image was pushed another way. \`opscrew rollback --list\` shows the versions to roll back to, and \`opscrew promote\` takes the image another environment runs."
            exit 1
          fi
          {
            echo "image=$image"
            echo "tag=$name:$TAG"
            echo "identity=https://github.com/$GITHUB_REPOSITORY/$workflow@refs/heads/$branch"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying \`$image\`, built by run $run_id from \`$commit\` on \`$branch\`." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to the server
    needs: [build, verify]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.verify.result == 'success') && (inputs.rollback || !contains(vars.OPSCREW_DEPLOY_PAUSED, '"j030-85dfaf5c-b/prod"')) }}
    runs-on: ubuntu-latest
    environment: j030-85dfaf5c-b-production
    permissions:
      contents: read
      packages: read
    outputs:
      previous: ${{ steps.start.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the edge's configuration with Caddy
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opscrew-edge"/sites
          cp opscrew/apps/j030-85dfaf5c-b/runtime/edge/compose.yaml "$RUNNER_TEMP/opscrew-edge"/compose.yaml
          mkdir -p "$RUNNER_TEMP/opscrew-edge"/tls/j030-85dfaf5c-b
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 1 -subj /CN=opscrew-placeholder -keyout "$RUNNER_TEMP/opscrew-edge"/tls/j030-85dfaf5c-b/origin.key -out "$RUNNER_TEMP/opscrew-edge"/tls/j030-85dfaf5c-b/origin.pem 2> /dev/null
          cp opscrew/apps/j030-85dfaf5c-b/runtime/edge/tls/pull.pem "$RUNNER_TEMP/opscrew-edge"/tls/j030-85dfaf5c-b/pull.pem
          remove_check_volumes() {
            for volume in $(docker volume ls -q --filter label=com.docker.compose.project=opscrew-edge-check); do
              docker volume rm "$volume" > /dev/null 2>&1 || true
            done
          }
          trap remove_check_volumes EXIT
          docker network inspect opscrew-edge > /dev/null 2>&1 || docker network create opscrew-edge > /dev/null
          cp opscrew/apps/j030-85dfaf5c-b/runtime/edge/sites/j030-85dfaf5c-b.caddy "$RUNNER_TEMP/opscrew-edge"/sites/j030-85dfaf5c-b.caddy
          if ! docker compose -p opscrew-edge-check -f "$RUNNER_TEMP/opscrew-edge"/compose.yaml run --rm --no-deps -T caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile < /dev/null; then
            echo '::error::Caddy refused this app'\''s edge configuration (opscrew/apps/j030-85dfaf5c-b/runtime/edge/sites/j030-85dfaf5c-b.caddy) for the reason above. Nothing was sent to the server, which keeps serving the previous version: fix the cause (opscrew provision --app j030-85dfaf5c-b renders the site again), then push again.'
            exit 1
          fi
      - name: Configure SSH with the pinned host key
        env:
          SSH_KEY: ${{ secrets.OPSCREW_J030_85DFAF5C_B_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.OPSCREW_J030_85DFAF5C_B_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/opscrew
          chmod 600 ~/.ssh/opscrew
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload runtime files and environment
        env:
          HOST: ${{ secrets.OPSCREW_J030_85DFAF5C_B_HOST }}
          OPSCREW_APP_ENV: ${{ secrets.OPSCREW_J030_85DFAF5C_B_APP_ENV }}
          OPSCREW_SERVICE_DB_ENV: ${{ secrets.OPSCREW_J030_85DFAF5C_B_SERVICE_DB_ENV }}
          OPSCREW_ORIGIN_TLS: ${{ secrets.OPSCREW_J030_85DFAF5C_B_ORIGIN_TLS }}
        run: |
          set -euo pipefail
          ssh_opts=(-i ~/.ssh/opscrew -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20)
          hold="$(ssh "${ssh_opts[@]}" "deploy@${HOST}" 'if [ -f /srv/apps/j030-85dfaf5c-b/.snapshots/.held ]; then echo held $(cat /srv/apps/j030-85dfaf5c-b/.snapshots/.held); fi')"
          if [[ "$hold" == held* ]]; then
            case "$hold" in "held rotation "*) printf '::error::OpsCrew changed nothing on the server: a credential rotation holds the app (the rotation of the plan %s), so its services may have new values the app does not use yet: finish the rotation with opscrew rotate --app j030-85dfaf5c-b, or put the old values back with opscrew rotate --undo --app j030-85dfaf5c-b, then try again.\n' "${hold#held rotation }" ;; *) printf '::error::OpsCrew changed nothing on the server: a restore holds the app (.snapshots/.held in its folder), so its data may be partly restored: finish the restore with opscrew restore <copy>, or run sh snapshot.sh resume in the app'\''s folder as the deploy user, then try again.\n' ;; esac
            exit 1
          fi
          ssh "${ssh_opts[@]}" "deploy@${HOST}" 'mkdir -p /srv/apps/j030-85dfaf5c-b'
          scp -r "${ssh_opts[@]}" opscrew/apps/j030-85dfaf5c-b/runtime/compose.yaml opscrew/apps/j030-85dfaf5c-b/runtime/edge "deploy@${HOST}:/srv/apps/j030-85dfaf5c-b/"
          printf '%s\n' "${OPSCREW_APP_ENV:-}" | ssh "${ssh_opts[@]}" "deploy@${HOST}" 'umask 077 && cat > /srv/apps/j030-85dfaf5c-b/app.env'
          printf '%s\n' "${OPSCREW_SERVICE_DB_ENV:-}" | ssh "${ssh_opts[@]}" "deploy@${HOST}" 'umask 077 && cat > /srv/apps/j030-85dfaf5c-b/db.env'
          case "${OPSCREW_ORIGIN_TLS:-}" in
            *"-----BEGIN CERTIFICATE-----"*"PRIVATE KEY-----"*) ;;
            *) echo "::error::The deploy secret OPSCREW_J030_85DFAF5C_B_ORIGIN_TLS must hold the app's Cloudflare origin certificate, then its private key. Run \`opscrew provision --app j030-85dfaf5c-b\` again to set it, then deploy again."; exit 1 ;;
          esac
          printf '%s\n' "$OPSCREW_ORIGIN_TLS" | sed '/-BEGIN [A-Z ]*PRIVATE KEY-/,$d' | ssh "${ssh_opts[@]}" "deploy@${HOST}" 'umask 077 && mkdir -p /srv/edge/tls/j030-85dfaf5c-b && chmod 700 /srv/edge/tls/j030-85dfaf5c-b && cat > /srv/edge/tls/j030-85dfaf5c-b/origin.pem.new'
          printf '%s\n' "$OPSCREW_ORIGIN_TLS" | sed -n '/-BEGIN [A-Z ]*PRIVATE KEY-/,$p' | ssh "${ssh_opts[@]}" "deploy@${HOST}" 'umask 077 && cat > /srv/edge/tls/j030-85dfaf5c-b/origin.key.new'
          ssh "${ssh_opts[@]}" "deploy@${HOST}" 'umask 077 && cat > /srv/apps/j030-85dfaf5c-b/snapshot.sh.new && mv -f /srv/apps/j030-85dfaf5c-b/snapshot.sh.new /srv/apps/j030-85dfaf5c-b/snapshot.sh' <<'SNAPSHOT'
          # OpsCrew's snapshots of j030-85dfaf5c-b's data on the app's server, generated from opscrew/apps/j030-85dfaf5c-b/plan.yaml; each deploy uploads it.
          #   sh snapshot.sh take <manual|release|scheduled> [--skip <service>]... [--stop <service>]... [--id <id>] [--version sha256:<hex>]
          #   sh snapshot.sh restore <id> [--only <service>] [--no-wait <service>]...
          #   sh snapshot.sh hold
          #   sh snapshot.sh resume
          #   sh snapshot.sh drill [<id>] [--only <service>] [--keep]
          #   sh snapshot.sh drill --remove
          #   sh snapshot.sh drill scheduled
          #   sh snapshot.sh list
          #   sh snapshot.sh delete <id>
          #   sh snapshot.sh offsite <id>
          APPS_DIR="${OPSCREW_APPS_DIR:-/srv/apps}"
          EDGE_DIR="${OPSCREW_EDGE_DIR:-/srv/edge}"
          set -eu
          cd "$APPS_DIR"/j030-85dfaf5c-b
          edge() { docker compose -p opscrew-edge -f "$EDGE_DIR"/compose.yaml "$@"; }
          SNAPSHOT_PARTS='db'
          SNAPSHOT_ONLINE='db'
          part_file() {
            case "$1" in
              db)
                echo db.dump
                ;;
              *) return 1 ;;
            esac
          }
          part_kind() {
            case "$1" in
              db)
                echo postgres
                ;;
              *) return 1 ;;
            esac
          }
          part_image() {
            case "$1" in
              db)
                echo 'postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb'
                ;;
              *) return 1 ;;
            esac
          }
          snapshot_room() {
            if df -Pk . | awk 'NR == 2 { exit !($4 >= 1048576 && $4 * 10 >= $2) }'; then return 0; fi
            rm -rf .snapshots/*.partial .snapshots/*.taking
            return 1
          }
          snapshot_run() {
            (umask 077; docker compose run --rm --no-deps -T --user "$(id -u):$(id -g)" -v "$APPS_DIR"/j030-85dfaf5c-b/.snapshots/"$1":/snapshot:"$2" --entrypoint sh "$3" -c "$4" < /dev/null >> .snapshots/snapshot.log 2>&1)
          }
          snapshot_box() {
            _box="$(docker compose ps -aq "$2")"
            [ -n "$_box" ] || return 1
            docker run --rm -i --network none --volumes-from "$_box:$1" busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4 sh -c "$3" 2>> .snapshots/snapshot.log
          }
          snapshot_stop() {
            docker compose stop -t 120 "$1" >> .snapshots/snapshot.log 2>&1 || return 1
            for _stopped in $(docker compose ps -aq "$1"); do
              case "$(docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' "$_stopped")" in
                "exited 137") return 1 ;;
                "exited "* | "created "*) ;;
                *) return 1 ;;
              esac
            done
          }
          snapshot_start() {
            case " ${SNAPSHOT_NO_WAIT:-} " in
              *" $1 "*) docker compose up -d --no-deps --no-recreate "$1" >> .snapshots/snapshot.log 2>&1 ;;
              *) docker compose up -d --no-deps --no-recreate --wait "$1" >> .snapshots/snapshot.log 2>&1 ;;
            esac
          }
          snapshot_tar() {
            _ran="$(docker compose ps -q "$1")"
            _copied=1
            if [ -n "$_ran" ]; then
              _tar_service="$1"
              trap 'snapshot_start "$_tar_service"' EXIT
              trap 'exit 129' HUP; trap 'exit 130' INT; trap 'exit 143' TERM
            fi
            if ! snapshot_stop "$1"; then
              printf '%s did not stop cleanly within 120 seconds (Docker killed it when the time ran out, or it ran out of memory), so OpsCrew did not copy its files.\n' "$1" >&2
            elif snapshot_box ro "$1" "tar -C / -cf - $3" < /dev/null > .snapshots/"$2"/"$1".tar; then
              _copied=0
            fi
            if [ -n "$_ran" ] && ! snapshot_start "$1"; then
              trap - EXIT HUP INT TERM
              printf '%s did not start again after its copy. Its output is in %s/.snapshots/snapshot.log; start it with docker compose up -d %s in %s.\n' "$1" "$APPS_DIR"/j030-85dfaf5c-b "$1" "$APPS_DIR"/j030-85dfaf5c-b >&2
              return 1
            fi
            trap - EXIT HUP INT TERM
            return "$_copied"
          }
          snapshot_untar() {
            docker compose stop -t 120 "$1" >> .snapshots/snapshot.log 2>&1 || return 1
            snapshot_box rw "$1" "$3" < .snapshots/"$2"/"$1".tar || return 1
            snapshot_start "$1"
          }
          part_take() {
            case "$1" in
              db)
                snapshot_run "$2" rw db 'umask 077 && export PGPASSWORD="$POSTGRES_PASSWORD" && pg_dump -h db -U app -Fc -f /snapshot/db.dump app'
                ;;
              *) return 1 ;;
            esac
          }
          part_restore() {
            case "$1" in
              db)
                snapshot_run "$2" ro db 'umask 077 && export PGPASSWORD="$POSTGRES_PASSWORD" && psql -X -q -h db -U app -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS app WITH (FORCE)" -c "CREATE DATABASE app OWNER app" && pg_restore -h db -U app -d app --no-owner --single-transaction /snapshot/db.dump'
                ;;
              *) return 1 ;;
            esac
          }
          snapshot_running() {
            if [ -f .env ]; then
              sed -n 's/^APP_IMAGE=.*@sha256:\([0-9a-f]\{64\}\)$/\1/p' .env
            elif [ -f .running ]; then
              sed -n 's/^[^=]*@sha256:\([0-9a-f]\{64\}\)$/\1/p' .running
            fi
          }
          snapshot_version() {
            _version="$(snapshot_running)"
            if [ -z "$_version" ] && [ -f .env ]; then
              _version_image="$(sed -n 's/^APP_IMAGE=//p' .env)"
              case "$_version_image" in
                "" | *@sha256:*) ;;
