# Generated by OpsCrew from opscrew/plan.yaml; `opscrew provision` regenerates it.
# The deploy workflow copies it to /srv/apps/nextjs-postgres-demo-staging on the server.
name: nextjs-postgres-demo-staging
services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is not set; deploy with the OpsCrew workflow}
    restart: unless-stopped
    env_file:
      - app.env
    environment:
      PORT: "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:'+process.env.PORT+'/api/health',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s
    stop_grace_period: 35s
    mem_limit: 512m
    memswap_limit: 512m
    security_opt: &a1
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    cap_drop:
      - ALL
    networks:
      - internal
      - opscrew-edge
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    env_file:
      - db.env
    volumes:
      - /srv/data/nextjs-postgres-demo-staging/db:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m
    memswap_limit: 512m
    security_opt: *a1
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - internal
networks:
  internal: {}
  opscrew-edge:
    external: true
