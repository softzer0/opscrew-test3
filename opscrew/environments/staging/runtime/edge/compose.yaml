# Generated by OpsCrew from opscrew/plan.yaml; `opscrew provision` regenerates it.
# OpsCrew's shared edge on the server (/srv/edge, Compose project opscrew-edge), in front of
# every OpsCrew app there: Caddy and kamal-proxy. Each app's deploy brings this file and puts it
# in /srv/edge only when its x-opscrew-edge-version is larger than the server's, or when its
# x-opscrew-edge-proxy differs (the switch, while the server holds one OpsCrew app).
name: opscrew-edge
x-opscrew-edge-version: 2026102103
x-opscrew-edge-proxy: caddy
services:
  kamal-proxy:
    image: basecamp/kamal-proxy:v0.10.2@sha256:a686220c2aa42c4f9bbcfe851b1d21b2cedee0b5c389890c29d205282379da7c
    restart: unless-stopped
    volumes:
      - kamal-proxy-config:/home/kamal-proxy/.config/kamal-proxy
    mem_limit: 32m
    memswap_limit: 32m
    security_opt: &a1
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    cap_drop:
      - ALL
    networks:
      - opscrew-edge
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - ./sites:/etc/caddy/sites:ro
      - ./tls:/etc/caddy/tls:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:2019/config/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    labels:
      dev.opscrew.caddyfile-sha256: 96c58dd6a946291ca56c20374f2ef685c88ecf716a4096823ef78c4203bbed22
    depends_on:
      - kamal-proxy
    security_opt: *a1
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - opscrew-edge
configs:
  caddyfile:
    content: |
      # OpsCrew's shared edge: each OpsCrew app on this server has its site in /srv/edge/sites/<app>.caddy.
      import /etc/caddy/sites/*.caddy

      # Requests for any other hostname are refused.
      http:// {
      	abort
      }
      https:// {
      	abort
      }
networks:
  opscrew-edge:
    external: true
volumes:
  caddy_data: {}
  caddy_config: {}
  kamal-proxy-config: {}
